
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swiftmask-ces"
version = "1.0.0"
description = "Compute-efficient foreground segmentation using a lightweight FCN"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "opencv-python",
    "matplotlib",
    "torch==2.12.1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
